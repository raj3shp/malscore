[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "malscore"
description = "Score the maliciousness of a Linux command or a session of commands (0-100) with MITRE ATT&CK mapping. Never executes its input."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "raj3shp"}]
keywords = [
    "security", "malware", "detection", "mitre", "att&ck", "linux",
    "shell", "command", "session", "scoring", "dfir", "threat-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6.1"]

[project.urls]
Homepage = "https://github.com/raj3shp/malscore"
Repository = "https://github.com/raj3shp/malscore"
Issues = "https://github.com/raj3shp/malscore/issues"
Changelog = "https://github.com/raj3shp/malscore/blob/main/CHANGELOG.md"

[project.scripts]
malscore = "malscore.cli:main"

[tool.setuptools.dynamic]
version = {attr = "malscore.__version__"}

[tool.setuptools.packages.find]
include = ["malscore*"]

[tool.setuptools.package-data]
malscore = ["py.typed"]
